<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedQual — Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card fade-in-up" style="max-width:460px">
            <div class="login-logo">
                <div class="logo-icon">⚗️</div>
                <div class="logo-text">Med<span>Qual</span></div>
            </div>

            <h1 class="login-title">Create Account</h1>
            <p class="login-subtitle">Register to access the quality monitoring system</p>

            <div id="reg-error" class="alert alert-error" style="display:none"></div>
            <div id="reg-success" class="alert alert-success" style="display:none"></div>

            <form onsubmit="handleRegister(event)">
                <div class="form-grid" style="margin-bottom:16px">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="reg-name" class="form-control"
                               placeholder="Dr. Jane Smith" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select id="reg-role" class="form-control">
                            <option value="viewer">Viewer</option>
                            <option value="lab_staff">Lab Staff</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:16px">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control"
                           placeholder="you@example.com" required>
                </div>

                <div class="form-group" style="margin-bottom:24px">
                    <label class="form-label">Password (min 6 characters)</label>
                    <input type="password" id="reg-password" class="form-control"
                           placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" id="reg-btn" class="btn btn-primary" style="width:100%;justify-content:center">
                    Create Account
                </button>
            </form>

            <p style="text-align:center;font-size:13px;color:var(--muted-foreground);margin-top:20px">
                Already have an account?
                <a href="index.html" style="color:var(--emerald-500);text-decoration:none">Sign in</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const errEl = document.getElementById('reg-error');
            const successEl = document.getElementById('reg-success');
            errEl.style.display = 'none';
            successEl.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Creating...';

            try {
                await apiCall('/register', 'POST', {
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value,
                    role: document.getElementById('reg-role').value
                });

                successEl.textContent = '✓ Account created! Redirecting to login...';
                successEl.style.display = 'flex';
                setTimeout(() => window.location.href = 'index.html', 2000);
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }
    </script>
</body>
</html>
